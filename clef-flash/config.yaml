# Подхватывается после перезапуска сервиса clef-flash.
# Порт и ключ задаются в .env.

model: Cloudflare/clef-flash

# Потолок этого образа: SGLang обрезает запрос на 16384.
context_length: 16384

# Один запрос на карту, чтобы второй prefill не забрал остаток памяти.
max_running_requests: 1

# Доля памяти карты под веса и KV. На RTX 4500 для Flash нужно около 0.90.
mem_fraction_static: 0.90
