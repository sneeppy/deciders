name: deciders

# Одна карта. Запускайте один сервис:
#   docker compose up -d clef        — полный Clef через Ollama (порт из .env, только localhost)
#   docker compose up -d clef-flash  — Clef-Flash через SGLang (порт из .env)

services:
  clef:
    image: ollama/ollama
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:${PORT}:11434"
    gpus: all
    restart: unless-stopped

  clef-flash:
    image: lmsysorg/sglang:dev-clef
    profiles: ["clef-flash"]
    env_file: .env
    environment:
      HF_HOME: /cache/huggingface
      HF_HUB_CACHE: /cache/huggingface/hub
      HUGGINGFACE_HUB_CACHE: /cache/huggingface/hub
      CLEF_CONFIG: /opt/jevs/clef-flash/config.yaml
    entrypoint: ["python3", "/opt/jevs/clef-flash/entrypoint.py"]
    volumes:
      - ./clef-flash:/opt/jevs/clef-flash:ro
      - hf-cache:/cache/huggingface
    ports:
      - "${PORT}:${PORT}"
    ipc: host
    shm_size: 32gb
    init: true
    restart: unless-stopped
    gpus: all
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  hf-cache:
  ollama:
    external: true
    name: ollama
